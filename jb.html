<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HOST:PERRUNOGT</title>

  <style>
    :root{
      --bg:#020504;
      --panel:#040e09;
      --green:#00ff88;
      --green3:#65ffb3;
      --text:#eafff3;
      --muted:#537565;
      --red:#ff365e;
      --yellow:#ffd400;
      --yellow2:#ffe66a;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%}

    body{
      position:relative;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#020504;
      color:var(--text);
      font-family:monospace,sans-serif;
    }

    /* Fondo estático */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(0,255,136,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,255,136,.018) 1px,transparent 1px);
      background-size:40px 40px;
      pointer-events:none;
    }

    #main-container{
      position:relative;
      width:min(88vw,440px);
      height:min(88vw,440px);
      min-width:290px;
      min-height:290px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:var(--panel);
      border:1px solid rgba(0,255,136,.22);
      border-radius:30px;
      box-shadow:0 10px 35px rgba(0,0,0,.72),0 0 18px rgba(0,255,136,.07);
    }

    #main-container::before,
    #main-container::after{
      content:"";
      position:absolute;
      width:42px;
      height:42px;
      border-color:var(--green);
      opacity:.7;
    }

    #main-container::before{
      top:-1px;
      left:-1px;
      border-top:2px solid;
      border-left:2px solid;
      border-radius:30px 0 0 0;
    }

    #main-container::after{
      right:-1px;
      bottom:-1px;
      border-right:2px solid;
      border-bottom:2px solid;
      border-radius:0 0 30px 0;
    }

    #brand{
      position:absolute;
      top:38px;
      color:#fff;
      font-size:clamp(17px,5vw,23px);
      font-weight:800;
      letter-spacing:.13em;
      text-shadow:0 0 8px rgba(0,255,136,.55);
    }

    #brand::before{
      content:"GOLDHEN HOST";
      display:block;
      margin-bottom:6px;
      text-align:center;
      font-size:8px;
      font-weight:400;
      letter-spacing:.35em;
      color:var(--muted);
    }

    #visual-indicator{
      position:relative;
      width:190px;
      height:150px;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-top:38px;
    }

    .core{
      position:relative;
      width:58px;
      height:58px;
      border-radius:14px;
      transform:rotate(45deg);
      background:var(--green);
      box-shadow:0 0 14px var(--green);
      z-index:5;
    }

    .core::before{
      content:"";
      position:absolute;
      width:22px;
      height:22px;
      top:18px;
      left:18px;
      background:#fff;
      border-radius:5px;
    }

    #visual-indicator::before,
    #visual-indicator::after{
      content:"";
      position:absolute;
      width:110px;
      height:110px;
      border:1px solid rgba(0,255,136,.18);
      transform:rotate(45deg);
    }

    #visual-indicator::after{
      width:150px;
      height:150px;
      border-color:rgba(0,255,136,.07);
    }

    /* Estático: sin spinner ni animaciones */
    #spin{display:none}

    .pulse{
      position:absolute;
      width:130px;
      height:130px;
      border-radius:18px;
      border:1px dashed rgba(0,255,136,.16);
      transform:rotate(45deg);
    }

    /* Estado GoldHEN */
    body.done{
      --green:var(--yellow);
      --green3:var(--yellow2);
    }

    body.done #main-container{
      border-color:var(--yellow);
      box-shadow:0 0 30px rgba(255,212,0,.30),0 0 55px rgba(255,212,0,.10);
    }

    body.done #main-container::before,
    body.done #main-container::after{
      border-color:var(--yellow);
    }

    body.done #brand{
      color:var(--yellow2);
      text-shadow:0 0 10px rgba(255,212,0,.85);
    }

    body.done #brand::before{color:#c7aa00}
    body.done .pulse{border-color:rgba(255,212,0,.70)}

    body.done #visual-indicator::before{
      border-color:rgba(255,212,0,.35);
    }

    body.done #visual-indicator::after{
      border-color:rgba(255,212,0,.14);
    }

    body.done .core{
      background:var(--yellow);
      box-shadow:0 0 20px var(--yellow),0 0 45px rgba(255,212,0,.35);
    }

    #exploit-title{
      position:fixed;
      top:72px;
      left:50%;
      transform:translateX(-50%);
      z-index:10;
      padding:10px 22px;
      color:var(--green);
      border:1px solid rgba(0,255,136,.45);
      border-radius:10px;
      background:rgba(2,12,7,.96);
      font-size:11px;
      font-weight:700;
      letter-spacing:.10em;
      text-align:center;
      white-space:nowrap;
    }

    body.done #exploit-title{
      color:var(--yellow);
      border-color:rgba(255,212,0,.70);
      box-shadow:0 0 20px rgba(255,212,0,.15);
    }

    #msg{
      position:fixed;
      top:18px;
      left:50%;
      transform:translateX(-50%);
      display:none;
      width:min(86vw,520px);
      padding:11px 22px;
      text-align:center;
      color:var(--red);
      background:rgba(2,12,7,.96);
      border:1px solid rgba(255,54,94,.45);
      border-radius:10px;
      font-size:13px;
      font-weight:700;
      letter-spacing:.16em;
      z-index:30;
    }

    body.fail #msg{display:block}

    body.done #msg{
      display:block;
      color:var(--yellow);
      background:rgba(18,15,0,.96);
      border-color:rgba(255,212,0,.72);
      box-shadow:0 0 25px rgba(255,212,0,.18);
      text-shadow:0 0 10px rgba(255,212,0,.80);
    }

    #credits{
      position:fixed;
      left:50%;
      bottom:48px;
      transform:translateX(-50%);
      z-index:10;
      width:min(92vw,700px);
      color:var(--green);
      font-size:10px;
      line-height:1.5;
      letter-spacing:.05em;
      text-align:center;
    }

    body.done #credits{
      color:var(--yellow);
      text-shadow:0 0 8px rgba(255,212,0,.45);
    }

    #footer{
      position:fixed;
      bottom:25px;
      color:rgba(140,210,170,.4);
      font-size:9px;
      letter-spacing:.22em;
      z-index:10;
    }

    #footer::before{
      content:"◆ ";
      color:var(--green);
    }

    body.done #footer::before{color:var(--yellow)}

    /*
      Compatibilidad con jb.js:
      los elementos permanecen en el DOM, pero sin interfaz de log normal.
    */
    #wrap,#state,#out{display:none}

    /* El modo diagnóstico ?log=1 sigue disponible */
    body.log{
      display:block;
      overflow:auto;
      padding:20px;
      background:var(--bg);
    }

    body.log::before,
    body.log #main-container,
    body.log #footer,
    body.log #exploit-title,
    body.log #credits,
    body.log #msg{
      display:none;
    }

    body.log #wrap{
      display:block;
      max-width:900px;
      margin:0 auto;
    }

    body.log #state{
      display:block;
      margin-bottom:12px;
      font-size:18px;
      font-weight:700;
      color:var(--text);
    }

    body.log #out{
      display:block;
      max-height:calc(100vh - 100px);
      overflow-y:auto;
      padding:16px;
      white-space:pre-wrap;
      font:12px/1.6 monospace,sans-serif;
      color:var(--text);
      background:#000;
      border:1px solid rgba(0,255,136,.16);
      border-radius:10px;
    }

    .ok,.safe{color:var(--green)}
    .bad,.danger{color:var(--red)}
    .warn{color:#e3b341}
    code{color:#72c99c}

    @media(max-width:600px){
      #exploit-title{
        top:55px;
        padding:8px 12px;
        font-size:8px;
      }
      #credits{
        bottom:42px;
        font-size:8px;
        padding:0 12px;
      }
      #main-container{
        width:88vw;
        height:88vw;
      }
      #msg{
        top:12px;
        font-size:10px;
        padding:9px 14px;
      }
    }
  </style>
</head>

<body>
  <div id="exploit-title">CARGA DE EXPLOIT GOLDHEN 11.00 A 13.52</div>

  <div id="main-container">
    <div id="brand">HOST:PERRUNOGT</div>
    <div id="visual-indicator">
      <div id="spin"></div>
      <div class="pulse"></div>
      <div class="core"></div>
    </div>
  </div>

  <div id="msg">GOLDHEN ACTIVADO</div>

  <div id="credits">
    Agradecimientos a Raw game y sistro por la distribución del exploit y carga de GoldHEN
  </div>

  <div id="wrap">
    <div id="state"></div>
    <div id="out"></div>
  </div>

  <div id="footer">PERRUNOGT // GOLDHEN HOST</div>

  <!-- Misma carga del jb.js original -->
  <script type="module">
    import "./jb.js?v=19";
  </script>
</body>
</html>
